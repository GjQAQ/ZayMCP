[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zaymcp"
version = "0.1.0"
description = "An MCP server for Ansys Zemax OpticStudio."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "pythonnet>=3.2.1",
]

[project.scripts]
zaymcp = "zaymcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
default-groups = "all"
package = true
